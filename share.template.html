<!DOCTYPE html>
<html lang="en">
<!--
  社交分享页 HTML 模板（后端渲染占位符后输出，结构对齐 share-test.html）

  发帖预览（对标 Reelshort）：
    左侧竖图 + 右侧 域名 / 标题 / 描述
  好友点击帖子：
    meta refresh 跳 {{LANDING_URL}}（FB 爬虫不跟跳转，仍读本页 <head> OG）

  占位符：
    {{OG_URL}}           本分享页完整 URL（与分享出去的链接一致）
    {{OG_TITLE}}         如 Episode 1 - The 5-time rejected luna | YogoShort
    {{OG_DESCRIPTION}}   简介（必填，否则 FB 右侧无描述）
    {{OG_IMAGE}}         封面 HTTPS 绝对地址，建议 9:16 竖图（360×640 webp）
    {{OG_SITE_NAME}}     如 YogoShort
    {{OG_LOCALE}}        如 en_US
    {{LANDING_URL}}      正片，如 https://yogoshort.com/video/{vid}/{ep}
    {{PAGE_TITLE}}       可与 {{OG_TITLE}} 相同

  部署注意：
    - robots.txt 须放行 facebookexternalhit / Twitterbot（否则 FB Debugger 403）
    - 输出为独立 .html，勿被 SPA 回落到 index.html
  无封面：删除 OG_IMAGE、TWITTER_IMAGE 注释块。
  不自动跳转：删除 REDIRECT 块。
-->
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- REDIRECT：真人点击分享链接后跳正片（爬虫不执行） -->
  <meta http-equiv="refresh" content="0;url={{LANDING_URL}}" />
  <!-- /REDIRECT -->

  <meta property="og:type" content="website" />
  <meta property="og:locale" content="{{OG_LOCALE}}" />
  <meta property="og:site_name" content="{{OG_SITE_NAME}}" />
  <meta property="og:url" content="{{OG_URL}}" />
  <meta property="og:title" content="{{OG_TITLE}}" />
  <meta property="og:description" content="{{OG_DESCRIPTION}}" />
  <!-- OG_IMAGE -->
  <meta property="og:image" content="{{OG_IMAGE}}" />
  <meta property="og:image:secure_url" content="{{OG_IMAGE}}" />
  <meta property="og:image:type" content="image/webp" />
  <meta property="og:image:width" content="360" />
  <meta property="og:image:height" content="640" />
  <!-- /OG_IMAGE -->

  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="{{OG_TITLE}}" />
  <meta name="twitter:description" content="{{OG_DESCRIPTION}}" />
  <!-- TWITTER_IMAGE -->
  <meta name="twitter:image" content="{{OG_IMAGE}}" />
  <!-- /TWITTER_IMAGE -->

  <meta name="description" content="{{OG_DESCRIPTION}}" />
  <title>{{PAGE_TITLE}}</title>
</head>
<body>
  <p><a href="{{LANDING_URL}}">Watch on {{OG_SITE_NAME}}</a></p>
</body>
</html>
